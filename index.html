<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092e43"><meta name="description" content="Crossing Quest — hop, dodge, and survive in a colorful endless road adventure."><title>Crossing Quest | Endless Road Adventure</title><link rel="stylesheet" href="./css/style.css"></head><body><main id="game-shell"><canvas class="game" aria-label="Three-dimensional crossing game"></canvas><header class="hud"><div class="brand"><div class="brand-icon">🐥</div><div><strong>CROSSING QUEST</strong><small>ENDLESS ROAD ADVENTURE</small></div></div><div class="hud-right"><div class="score-card"><small>SCORE</small><span id="score">0</span></div><div class="score-card"><small>BEST</small><span id="best-score">0</span></div><button id="pause" class="pause-btn" aria-label="Pause or resume game">Ⅱ Pause</button></div></header><div class="instructions">ARROW KEYS / WASD · SWIPE TO MOVE</div><nav id="controls" aria-label="Movement controls"><div class="dpad"><button id="forward" class="forward" aria-label="Move forward">▲</button><button id="left" aria-label="Move left">◀</button><button id="backward" aria-label="Move backward">▼</button><button id="right" aria-label="Move right">▶</button></div></nav><div id="paused-overlay" class="overlay"><div class="dialog"><span class="eyebrow">TAKE A BREAK</span><h1>Paused</h1><p>Press P, Space, or Resume to keep crossing.</p><button onclick="document.getElementById('pause').click()">▶ Resume</button></div></div><div id="result-container" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title"><div id="result" class="dialog"><span class="eyebrow">YOUR JOURNEY ENDS HERE</span><h1 id="result-title">Game Over!</h1><div class="medal">🏆</div><p>You crossed <strong id="final-score">0</strong> rows</p><p class="hint">One more run? You've got this.</p><button id="retry">↻ Play Again</button></div></div><footer class="foot">DODGE THE TRAFFIC • BEAT YOUR BEST</footer></main><script type="module" src="./js/game.js"></script></body></html>
